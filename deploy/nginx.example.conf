# Example only: replace the domain and the certificate paths, and review any
# existing virtual hosts first. The application listens on 127.0.0.1:8765 and must
# not be reachable from the Internet directly.
server {
    listen 443 ssl;
    server_name zhijian.example.com;
    ssl_certificate /etc/letsencrypt/live/zhijian.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhijian.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        # The application sets Cache-Control itself: private data is never cacheable and
        # only content-hashed static files are. Do not add a shared cache (proxy_cache).
    }
}
server {
    listen 80;
    server_name zhijian.example.com;
    return 308 https://$host$request_uri;
}
