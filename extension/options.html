<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Paper Reader 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>在哪里打开论文</h1>
      <p class="lead">
        点击工具栏按钮或右键菜单时，网址会发到你选的 Open Paper Reader 服务。
        只发送网址，不发送 cookie 或页面内容。
      </p>
      <form id="form">
        <fieldset>
          <legend>服务地址</legend>
          <label class="choice">
            <input type="radio" name="kind" value="local" />
            <span>
              本机版 <code>http://127.0.0.1:8765</code>
              <small>在自己电脑上运行 Open Paper Reader 时选这个。</small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="kind" value="hosted" />
            <span>
              在线版 <code>https://papers.dougao.online</code>
              <small>用在线版账号时选这个。</small>
            </span>
          </label>
          <label class="choice">
            <input type="radio" name="kind" value="custom" />
            <span>自己的服务器</span>
          </label>
          <input
            id="custom"
            type="text"
            inputmode="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://papers.example.org"
            aria-label="自己的服务器地址"
          />
        </fieldset>
        <p id="status" role="status"></p>
        <button type="submit">保存</button>
      </form>
    </main>
    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
