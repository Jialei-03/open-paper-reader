# The local, one-command build: `uvx open-research`, or `uv tool install open-research` and then `ora`.
# ("open-research-agent" on PyPI is someone else's project.)
# The hosted site keeps installing from backend/requirements.txt; this file only
# describes the package. Build it with scripts/build-local.sh, which builds the
# web app first (frontend/dist is bundled into the wheel). See docs/LOCAL.md.

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-research"
version = "0.3.0"
description = "An open research agent on your own computer: it keeps its direction, runs real experiments, and every conclusion can be checked. Also reads papers with cited guides."
readme = "docs/LOCAL.md"
# Below 3.14: pinned native dependencies (pydantic-core) have no 3.14 wheels yet,
# and uv would otherwise pick the newest Python and try to compile them.
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "docs/NOTICE.md"]
keywords = ["research", "agent", "experiments", "papers", "pdf", "reader"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Environment :: Web Environment",
  "Topic :: Scientific/Engineering",
]
# Same pins as backend/requirements.txt, without the PostgreSQL driver: the
# local build always uses SQLite.
dependencies = [
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.43",
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "python-multipart==0.0.32",
  "pydantic==2.11.7",
  "pillow==12.3.0",
  "pypdf==6.18.1",
  "cryptography==50.0.2",
  "fonttools==4.66.0",
  "httpx==0.28.1",
  "regex==2024.11.6",
  "pylatexenc==2.10",
  "pypdfium2==5.13.0",
  "ruamel.yaml==0.18.6",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.10"]
# Mirroring research experiments to an experiment tracker; either one is enough.
tracking = ["swanlab>=0.10", "wandb>=0.21"]

[project.scripts]
ora = "backend.local.cli:main"
open-research = "backend.local.cli:main"
# The names of earlier releases, kept working.
open-paper-reader = "backend.local.cli:main"
opr = "backend.local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
exclude = ["backend/tests", "backend/devtools", "**/__pycache__", "**/*.pyc"]

# Built web app, the assistant runtime's sources (its npm dependencies are
# installed on first start, see backend/local/cli.py) and the pinned BabelDOC
# patches used by the on-demand layout translation install.
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "backend/_bundle/frontend/dist"
"agent-runtime/runner.mjs" = "backend/_bundle/agent-runtime/runner.mjs"
"agent-runtime/model-call.mjs" = "backend/_bundle/agent-runtime/model-call.mjs"
"agent-runtime/model-lease.mjs" = "backend/_bundle/agent-runtime/model-lease.mjs"
"agent-runtime/network.mjs" = "backend/_bundle/agent-runtime/network.mjs"
"agent-runtime/sandbox-tools.mjs" = "backend/_bundle/agent-runtime/sandbox-tools.mjs"
"agent-runtime/pi-tools.json" = "backend/_bundle/agent-runtime/pi-tools.json"
"agent-runtime/package.json" = "backend/_bundle/agent-runtime/package.json"
"agent-runtime/package-lock.json" = "backend/_bundle/agent-runtime/package-lock.json"
"agent-runtime/skills" = "backend/_bundle/agent-runtime/skills"
"deploy/translation/patch_layout_fonts.py" = "backend/_bundle/layout/patch_layout_fonts.py"
"deploy/translation/patch_layout_quality.py" = "backend/_bundle/layout/patch_layout_quality.py"

[tool.hatch.build.targets.sdist]
# frontend/dist is built, not committed: .gitignore must not keep it out.
ignore-vcs = true
include = [
  "backend",
  "agent-runtime/*.mjs",
  "agent-runtime/*.json",
  "agent-runtime/skills",
  "deploy/translation/patch_layout_*.py",
  "frontend/dist",
  "docs/LOCAL.md",
  "LICENSE",
  "docs/NOTICE.md",
]
exclude = ["backend/tests", "**/__pycache__", "agent-runtime/node_modules"]

[tool.alembic]
script_location = "%(here)s/backend/migrations"
prepend_sys_path = ["%(here)s"]
path_separator = "os"
"sqlalchemy.url" = "sqlite:///./data/platform.db"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
# Four processes: about a minute for the whole suite instead of six or seven.
# `-n 0` runs it in one process (what the PostgreSQL tests need: one shared database).
addopts = "-n 4"
