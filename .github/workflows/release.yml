name: Release
# A tag like v0.3.0 builds the package (with the web app inside), attaches it
# to a GitHub release (what install.sh installs), and, once the repository
# variable PUBLISH_PYPI is "true", publishes it as "open-research" on PyPI
# (`uvx open-research`). PyPI trusts this workflow: no token is stored here.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm --prefix frontend ci --ignore-scripts
      - run: sh scripts/build-local.sh
      - name: The package starts
        run: |
          uvx --python 3.12 --from dist/*.whl ora --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: The release, with the package and the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## \[/{n++} n==1' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/* install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes "安装：curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh

          $notes"
  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
