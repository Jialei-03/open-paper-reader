name: Verify workspace
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            agent-runtime/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix agent-runtime ci --ignore-scripts
      - run: npm --prefix agent-runtime test
      - run: .venv/bin/python -m pytest -q --junitxml=test-results/backend.xml
      - run: npm --prefix frontend run check
      - run: .venv/bin/python scripts/verify_lifecycle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: test-results/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            agent-runtime/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r backend/requirements-dev.txt
      - run: npm --prefix frontend ci --ignore-scripts
      - run: npm --prefix agent-runtime ci --ignore-scripts
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
  postgres-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: paper_test
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: paper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paper_test -d paper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://paper_test:ephemeral-ci-password@127.0.0.1:5432/paper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q backend/tests/postgres --junitxml=test-results/postgres.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-recovery-results
          path: test-results/postgres.xml
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start the stack
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: The API answers and serves the built frontend
        run: |
          curl -fsS http://127.0.0.1:8765/api/v1/health
          curl -fsS http://127.0.0.1:8765/ | grep -q '<div id="root">'
      - name: An account can be created and used
        run: |
          curl -fsS -c jar -X POST http://127.0.0.1:8765/api/v1/auth/register \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:8765' \
            -d '{"username":"ci_user","password":"ci-password-123456"}'
      - name: All application processes are still up
        run: |
          docker compose ps
          test "$(docker compose ps --status running --services | sort | tr '\n' ' ')" = "db preparation web worker "
      - if: failure()
        run: docker compose logs --no-color --tail 200
